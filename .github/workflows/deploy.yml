name: 🚀 Deploy Trust Insurance to cPanel

on:
  push:
    branches:
      - main
      - master

jobs:
  build-and-deploy:
    name: Build & FTP Deploy
    runs-on: ubuntu-latest

    steps:
      - name: 📥 1. Checkout repository code
        uses: actions/checkout@v4

      - name: 🟢 2. Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './Frontend/package-lock.json'

      - name: 📦 3. Install dependencies & Build Production Dist
        run: |
          cd Frontend
          npm ci
          npm run build

      - name: 🚀 4. Upload production build to cPanel via FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./Frontend/dist/
          server-dir: ./public_html/
          dangerous-clean-slate: false
